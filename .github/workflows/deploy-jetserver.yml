# העלאה אוטומטית של האתר לאחסון ב-JetServer בכל דחיפה ל-main:
# בונה את האתר (npm run build) ומעלה את תיקיית dist לשרת ב-FTPS. רק קבצים שהשתנו עולים.
# פרטי הגישה נשמרים ב-GitHub: Settings ← Secrets and variables ← Actions:
#   FTP_SERVER (israel69.jetserver.net), FTP_USERNAME, FTP_PASSWORD (חובה), FTP_DIR (לא חובה). חשבון ה-FTP הייעודי deploy@galilagroup.com נפתח ישירות על public_html, ולכן ברירת המחדל ./
# כל עוד FTP_SERVER לא הוגדר, הבנייה רצה וההעלאה מדולגת.
name: העלאה ל-JetServer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-jetserver
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: העלאה לשרת
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_DIR || './' }}
